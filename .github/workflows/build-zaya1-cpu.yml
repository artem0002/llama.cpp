name: Build ZAYA1 CPU Windows
on:
  workflow_dispatch:
  push:
    branches: [zaya1-support]
concurrency:
  group: build-zaya1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_CURL=OFF ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DGGML_OPENMP=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=ON ^
            -DLLAMA_BUILD_SERVER=ON
        shell: cmd

      - name: Build
        run: cmake --build build --config Release
        shell: cmd

      - name: Collect
        run: |
          mkdir out
          Get-ChildItem -Path build -Filter "llama-server.exe" -Recurse | Copy-Item -Destination out
          Get-ChildItem -Path build -Filter "llama-cli.exe" -Recurse | Copy-Item -Destination out
          Get-ChildItem out
        shell: pwsh

      - name: Package
        run: Compress-Archive -Path out -DestinationPath llama-zaya1-cpu-windows.zip
        shell: pwsh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-zaya1-cpu-windows
          path: llama-zaya1-cpu-windows.zip
          retention-days: 90
