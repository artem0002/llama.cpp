name: Build ZAYA1 CPU Windows
on:
  workflow_dispatch:
  push:
    branches: [zaya1-support]
concurrency:
  group: build-zaya1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build (static, no CURL, no DLLs needed)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release

      - name: Collect exe files
        run: |
          mkdir out
          Get-ChildItem -Path build -Filter "llama-*.exe" -Recurse | Copy-Item -Destination out
          Get-ChildItem -Path build -Filter "*.dll" -Recurse | Copy-Item -Destination out
        shell: pwsh

      - name: List files
        run: Get-ChildItem out
        shell: pwsh

      - name: Package
        run: Compress-Archive -Path out -DestinationPath llama-zaya1-cpu-windows.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-zaya1-cpu-windows
          path: llama-zaya1-cpu-windows.zip
          retention-days: 90
