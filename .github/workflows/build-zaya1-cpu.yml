name: Build ZAYA1 CPU Binaries
on:
  workflow_dispatch:
  push:
    branches: [zaya1-support]
concurrency:
  group: build-zaya1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-linux-avx2:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev libopenblas-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DGGML_NATIVE=OFF -DLLAMA_CURL=ON && cmake --build build --config Release -j$(nproc)
      - run: mkdir -p out && cp build/bin/llama-* out/ 2>/dev/null; cp build/src/libllama.* out/ 2>/dev/null; cp build/ggml/src/libggml.* out/ 2>/dev/null; chmod +x out/llama-* && tar -czf llama-zaya1-cpu-linux-avx2.tar.gz out/
      - uses: actions/upload-artifact@v4
        with: {name: llama-zaya1-cpu-linux-avx2, path: llama-zaya1-cpu-linux-avx2.tar.gz, retention-days: 90}
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=ON && cmake --build build --config Release
      - run: |
          mkdir out
          copy build\bin\Release\llama-*.exe out\
          copy build\bin\Release\*.dll out\
          copy build\src\Release\llama.dll out\ 2>$null
          copy build\src\Release\llama-common.dll out\ 2>$null
          copy build\ggml\src\Release\ggml-base.dll out\ 2>$null
          copy build\ggml\src\Release\*.dll out\ 2>$null
          copy build\bin\Release\mtmd.dll out\ 2>$null
        shell: pwsh
      - run: Compress-Archive -Path out -DestinationPath llama-zaya1-cpu-windows.zip
      - uses: actions/upload-artifact@v4
        with: {name: llama-zaya1-cpu-windows, path: llama-zaya1-cpu-windows.zip, retention-days: 90}
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DLLAMA_CURL=ON && cmake --build build --config Release -j$(sysctl -n hw.ncpu)
      - run: mkdir -p out && cp build/bin/llama-* out/ 2>/dev/null; cp build/src/libllama.* out/ 2>/dev/null; cp build/ggml/src/libggml.* out/ 2>/dev/null; chmod +x out/llama-* && zip -r llama-zaya1-cpu-macos-arm64.zip out/
      - uses: actions/upload-artifact@v4
        with: {name: llama-zaya1-cpu-macos-arm64, path: llama-zaya1-cpu-macos-arm64.zip, retention-days: 90}
