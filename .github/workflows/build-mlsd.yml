# .github/workflows/build-mlsd.yml
# Сборка llama-server + llama-speculative-mlsd для Windows (CPU-only)

name: Build MLSD for Windows

on:
  push:
    branches: [mlsd]       # ← ИСПРАВЛЕНО: было "lsd]"
    paths: [
      '.github/workflows/build-mlsd.yml',
      '**/CMakeLists.txt',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp'
    ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-cpu:
    name: Windows CPU (static, x64)
    runs-on: windows-2025
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Установка Ninja
        run: choco install ninja -y

      - name: Кэш (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mlsd-windows-cpu
          max-size: 500M

      - name: Настройка CMake
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -D GGML_NATIVE=ON ^
            -D LLAMA_BUILD_SERVER=ON ^
            -D BUILD_SHARED_LIBS=OFF ^
            -D GGML_RPC=OFF ^
            -D LLAMA_CURL=ON

      - name: Компиляция llama-server
        shell: cmd
        run: |
          cmake --build build --config Release --target llama-server -j %NUMBER_OF_PROCESSORS%

      - name: Компиляция llama-speculative-mlsd
        shell: cmd
        run: |
          cmake --build build --config Release --target llama-speculative-mlsd -j %NUMBER_OF_PROCESSORS%

      - name: Компиляция llama-cli
        shell: cmd
        run: |
          cmake --build build --config Release --target llama-cli -j %NUMBER_OF_PROCESSORS%

      - name: Проверка бинарников
        shell: pwsh
        run: |
          $binDir = "build\bin\Release"
          if (Test-Path $binDir) {
            Get-ChildItem $binDir -Filter "*.exe" | ForEach-Object {
              Write-Host ("  {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
            }
          }

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: mlsd-windows-cpu-x64
          path: |
            build/bin/Release/llama-server.exe
            build/bin/Release/llama-speculative-mlsd.exe
            build/bin/Release/llama-cli.exe
          retention-days: 30
          if-no-files-found: warn

  build-windows-openblas:
    name: Windows CPU + OpenBLAS (x64)
    runs-on: windows-2025
    env:
      OPENBLAS_VERSION: 0.3.23
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Установка Ninja
        run: choco install ninja -y

      - name: Загрузка OpenBLAS
        shell: pwsh
        run: |
          curl.exe -o $env:RUNNER_TEMP/openblas.zip -L "https://github.com/xianyi/OpenBLAS/releases/download/v$env:OPENBLAS_VERSION/OpenBLAS-$env:OPENBLAS_VERSION-x64.zip"
          mkdir $env:RUNNER_TEMP/openblas
          tar.exe -xvf $env:RUNNER_TEMP/openblas.zip -C $env:RUNNER_TEMP/openblas
          $vcdir = (vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          $msvc = (Join-Path $vcdir $('VC\Tools\MSVC\'+(Get-Content -Raw (Join-Path $vcdir 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()))
          $lib = (Join-Path $msvc 'bin\Hostx64\x64\lib.exe')
          & $lib /machine:x64 "/def:$env:RUNNER_TEMP/openblas/lib/libopenblas.def" "/out:$env:RUNNER_TEMP/openblas/lib/openblas.lib" /name:openblas.dll

      - name: Кэш (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mlsd-windows-openblas
          max-size: 500M

      - name: Настройка CMake (OpenBLAS)
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -D GGML_NATIVE=ON ^
            -D LLAMA_BUILD_SERVER=ON ^
            -D BUILD_SHARED_LIBS=OFF ^
            -D GGML_BLAS=ON ^
            -D GGML_BLAS_VENDOR=OpenBLAS ^
            -D BLAS_INCLUDE_DIRS="%RUNNER_TEMP%/openblas/include" ^
            -D BLAS_LIBRARIES="%RUNNER_TEMP%/openblas/lib/openblas.lib"

      - name: Компиляция llama-server (OpenBLAS)
        shell: cmd
        run: |
          cmake --build build --config Release --target llama-server -j %NUMBER_OF_PROCESSORS%

      - name: Компиляция llama-speculative-mlsd (OpenBLAS)
        shell: cmd
        run: |
          cmake --build build --config Release --target llama-speculative-mlsd -j %NUMBER_OF_PROCESSORS%

      - name: Добавление openblas.dll
        shell: pwsh
        run: |
          cp $env:RUNNER_TEMP/openblas/bin/libopenblas.dll ./build/bin/Release/openblas.dll

      - name: Загрузка артефактов (OpenBLAS)
        uses: actions/upload-artifact@v4
        with:
          name: mlsd-windows-openblas-x64
          path: |
            build/bin/Release/llama-server.exe
            build/bin/Release/llama-speculative-mlsd.exe
            build/bin/Release/openblas.dll
          retention-days: 30
          if-no-files-found: warn
