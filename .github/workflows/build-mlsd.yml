# .github/workflows/build-mlsd.yml
# Сборка llama-server + llama-speculative-mlsd для Windows (CPU-only)
# Конфигурация аналогична официальной сборке llama.cpp для максимальной производительности

name: Build MLSD for Windows

on:
  push:
    branches: [ mlsd ]
    paths: [
      '.github/workflows/build-mlsd.yml',
      '**/CMakeLists.txt',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp'
    ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-cpu:
    name: Windows CPU (static, x64)
    runs-on: windows-2025
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Установка Ninja
        run: choco install ninja -y

      - name: Кэш (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mlsd-windows-cpu-v2
          max-size: 500M

      - name: Настройка CMake
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -D GGML_NATIVE=OFF ^
            -D GGML_BACKEND_DL=ON ^
            -D GGML_CPU_ALL_VARIANTS=ON ^
            -D GGML_OPENMP=ON ^
            -D LLAMA_BUILD_SERVER=ON ^
            -D LLAMA_BUILD_TOOLS=ON ^
            -D LLAMA_BUILD_TESTS=OFF ^
            -D LLAMA_CURL=ON ^
            -D GGML_RPC=OFF

      - name: Компиляция llama-server
        shell: cmd
        run: |
          cmake --build build --config Release --target llama-server -j %NUMBER_OF_PROCESSORS%

      - name: Компиляция llama-speculative-mlsd
        shell: cmd
        run: |
          cmake --build build --config Release --target llama-speculative-mlsd -j %NUMBER_OF_PROCESSORS%

      - name: Компиляция llama-cli
        shell: cmd
        run: |
          cmake --build build --config Release --target llama-cli -j %NUMBER_OF_PROCESSORS%

      - name: Копирование OpenMP DLL
        shell: pwsh
        run: |
          $ompDll = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\14.44.35112\debug_nonredist\x64\Microsoft.VC143.OpenMP.LLVM\libomp140.x86_64.dll"
          if (Test-Path $ompDll) {
            Copy-Item $ompDll .\build\bin\Release\
            Write-Host "OpenMP DLL скопирована"
          } else {
            Write-Host "WARNING: OpenMP DLL не найдена, ищу альтернативные пути..."
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist" -Recurse -Filter "libomp*.dll" | ForEach-Object {
              Write-Host "Найдена: $($_.FullName)"
              Copy-Item $_.FullName .\build\bin\Release\
            }
          }

      - name: Проверка бинарников
        shell: pwsh
        run: |
          $binDir = "build\bin\Release"
          if (Test-Path $binDir) {
            Write-Host "=== Файлы в $binDir ==="
            Get-ChildItem $binDir | ForEach-Object {
              Write-Host ("  {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
            }
          }

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: mlsd-windows-cpu-x64
          path: build/bin/Release/
          retention-days: 30
          if-no-files-found: warn
